<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta id="metaDescription" name="description" content="Convert images into ASCII art in your browser." />
  <meta name="color-scheme" content="dark" />
  <title>AA Maker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="AA Maker home">
        <span class="brand-mark">AA</span>
        <span>Maker</span>
      </a>

      <nav id="languageSwitcher" class="language-switcher" aria-label="Language">
        <button type="button" data-language="auto">Auto</button>
        <button type="button" data-language="en">English</button>
        <button type="button" data-language="ja">日本語</button>
      </nav>
    </header>

    <main class="workspace">
      <aside class="control-panel">
        <section class="panel-section">
          <div class="section-heading">
            <h1 data-i18n="image">Image</h1>
            <button id="clear" class="quiet-button" type="button" disabled data-i18n="clear">Clear</button>
          </div>

          <label id="dropZone" class="upload-card" for="upload" tabindex="0">
            <input id="upload" type="file" accept="image/*" hidden />

            <div id="dropPlaceholder" class="upload-placeholder">
              <span class="upload-symbol" aria-hidden="true">+</span>
              <strong data-i18n="chooseImage">Choose image</strong>
              <span data-i18n="dropImage">Drop image here</span>
            </div>

            <img id="imagePreview" class="image-preview" alt="" />
          </label>

          <div id="imageInfo" class="image-info is-hidden">
            <span id="imageName"></span>
            <span id="imageMeta"></span>
          </div>
        </section>

        <section class="panel-section">
          <h2 data-i18n="size">Size</h2>

          <div class="mode-switch" role="radiogroup" data-i18n-aria="scaleMode">
            <label>
              <input type="radio" name="scaleMode" value="aspect" checked />
              <span data-i18n="auto">Auto</span>
            </label>
            <label>
              <input type="radio" name="scaleMode" value="custom" />
              <span data-i18n="custom">Custom</span>
            </label>
          </div>

          <div class="field-grid">
            <label class="field" for="width">
              <span data-i18n="width">Width</span>
              <input id="width" type="number" value="50" min="4" max="1000" inputmode="numeric" />
            </label>
            <label class="field" for="height">
              <span data-i18n="height">Height</span>
              <input id="height" type="number" value="50" min="1" max="1000" inputmode="numeric" disabled />
            </label>
          </div>
        </section>

        <section class="panel-section">
          <label class="section-label" for="charset" data-i18n="characters">Characters</label>
          <select id="charset" class="select-input">
            <option value="dots" data-i18n="charsetDots">Braille</option>
            <option value="numbers" data-i18n="charsetNumbers">Numbers</option>
            <option value="alpha_upper" data-i18n="charsetUpper">Uppercase</option>
            <option value="alpha_lower" data-i18n="charsetLower">Lowercase</option>
            <option value="alpha_both" data-i18n="charsetBoth">Upper + lower</option>
            <option value="kana" data-i18n="charsetKatakana">Katakana</option>
            <option value="hiragana" data-i18n="charsetHiragana">Hiragana</option>
            <option value="kanji" data-i18n="charsetKanji">Kanji</option>
            <option value="custom" data-i18n="charsetCustom">Custom</option>
          </select>

          <label id="customCharsField" class="field custom-field is-hidden" for="customChars">
            <span data-i18n="customCharacters">Custom characters</span>
            <input id="customChars" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="customPlaceholder" />
          </label>
        </section>

        <button id="convert" class="primary-button" type="button" disabled data-i18n="convert">Convert</button>
      </aside>

      <section class="result-panel" aria-labelledby="outputTitle">
        <div class="result-header">
          <div>
            <h2 id="outputTitle" data-i18n="output">Output</h2>
            <span id="outputMeta" class="output-meta" data-i18n="waiting">Waiting</span>
          </div>

          <div class="result-actions">
            <button id="copy" class="action-button" type="button" disabled data-i18n="copy">Copy</button>
            <button id="download" class="action-button" type="button" disabled data-i18n="download">Download</button>
          </div>
        </div>

        <div class="output-window">
          <div id="emptyState" class="empty-state" data-i18n="empty">Output appears here</div>
          <pre id="ascii-art" class="ascii-art is-hidden" tabindex="0"></pre>
        </div>
      </section>
    </main>
  </div>

  <canvas id="canvas" hidden></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
